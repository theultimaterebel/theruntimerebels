[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rootcheck"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "mcp",
    "openai",
    "pydantic",
    "python-dotenv"
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
